name: CI

# Runs automatic checks on every change to the site.
# Green check = safe to publish. Red X = something needs a look before it goes live.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If new changes arrive while a check is still running, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (catches broken code references)
        run: npm run typecheck

      - name: Run tests (checks the important logic still works)
        run: npm test
